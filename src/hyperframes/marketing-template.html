<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>H-Flow Marketing</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        body {
            margin: 0; padding: 0;
            background-color: #0A0A0A; /* Fondo oscuro puro corporativo */
            color: #EAEAEA; /* Texto claro */
            font-family: 'Inter', sans-serif;
            width: 1080px; height: 1920px; /* Formato TikTok / Reels */
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            overflow: hidden;
        }
        .accent {
            color: #3B82F6; /* Azul H-Flow */
            text-shadow: 0 0 25px rgba(59, 130, 246, 0.6);
        }
        .dashboard-mockup {
            background: #111111;
            border: 2px solid #222;
            border-radius: 40px;
            width: 80%; padding: 60px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            opacity: 0; /* Oculto para la animación inicial */
            transform: translateY(100px);
        }
        h1 { font-size: 80px; text-align: center; margin-bottom: 60px; }
        .athlete-row {
            display: flex; justify-content: space-between;
            background: #1A1A1A; padding: 40px;
            border-radius: 20px; margin-bottom: 25px;
            border-left: 12px solid #3B82F6;
        }
        .athlete-name { font-size: 45px; font-weight: bold; }
        .athlete-status { font-size: 40px; color: #888; }
    </style>
</head>
<body>
    <h1 id="headline">El fin del <span class="accent">caos</span></h1>
    
    <div class="dashboard-mockup" id="dashboard">
        <!-- Estos datos se inyectarán dinámicamente desde Node.js -->
        <div class="athlete-row"><span class="athlete-name" id="ath1">Cargando...</span><span class="athlete-status">Rutina completada</span></div>
        <div class="athlete-row"><span class="athlete-name" id="ath2">Cargando...</span><span class="athlete-status">Falta feedback</span></div>
        <div class="athlete-row"><span class="athlete-name" id="ath3">Cargando...</span><span class="athlete-status">Check-in listo</span></div>
    </div>

    <!-- Script de Animación (GSAP) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        // Leer datos inyectados por el backend de H-Flow
        if (window.HFLOW_DATA) {
            document.getElementById('headline').innerHTML = window.HFLOW_DATA.headline || 'H-Flow: Fin del caos';
            document.getElementById('ath1').innerText = window.HFLOW_DATA.athlete1 || 'Carlos M.';
            document.getElementById('ath2').innerText = window.HFLOW_DATA.athlete2 || 'Laura S.';
            document.getElementById('ath3').innerText = window.HFLOW_DATA.athlete3 || 'David G.';
        }

        // Animación suave y cinemática de entrada
        gsap.to("#dashboard", { y: 0, opacity: 1, duration: 1.5, ease: "power4.out", delay: 0.5 });
        gsap.from(".athlete-row", { x: -50, opacity: 0, duration: 1, stagger: 0.2, delay: 1, ease: "power3.out" });
    </script>
</body>
</html>
