apiVersion: v1
kind: Service
metadata:
  name: hflow-backend
  namespace: hflow
  labels:
    app: hflow-backend
spec:
  type: ClusterIP
  selector:
    app: hflow-backend
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hflow-backend
  namespace: hflow
  labels:
    app: hflow-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hflow-backend
  template:
    metadata:
      labels:
        app: hflow-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "3000"
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: ghcr.io/your-org/hflow-backend:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: hflow-config
            - secretRef:
                name: hflow-secrets
          env:
            - name: PORT
              value: "3000"
          volumeMounts:
            - name: uploads
              mountPath: /app/hflow-backend/uploads
            - name: marketing
              mountPath: /app/hflow-backend/storage
            - name: workout-videos
              mountPath: /app/hflow-backend/storage/workout-videos
            - name: logs
              mountPath: /app/hflow-backend/logs
          startupProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 60
            failureThreshold: 3
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: hflow-uploads
        - name: marketing
          persistentVolumeClaim:
            claimName: hflow-marketing
        - name: workout-videos
          persistentVolumeClaim:
            claimName: hflow-workout-videos
        - name: logs
          emptyDir: {}
