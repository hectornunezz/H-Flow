apiVersion: v1
kind: Service
metadata:
  name: hflow-frontend
  namespace: hflow
  labels:
    app: hflow-frontend
spec:
  type: NodePort
  selector:
    app: hflow-frontend
  ports:
    - name: http
      port: 3001
      targetPort: http
      nodePort: 30001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hflow-frontend
  namespace: hflow
  labels:
    app: hflow-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hflow-frontend
  template:
    metadata:
      labels:
        app: hflow-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: frontend
          image: ghcr.io/your-org/hflow-frontend:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: hflow-config
          env:
            - name: PORT
              value: "3001"
          startupProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
